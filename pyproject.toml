[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencloud-tui"
version = "1.0.0"
description = "SoundCloud audio downloader for the terminal"
requires-python = ">=3.10"
dependencies = [
    "textual",
    "yt-dlp"
]

[project.scripts]
opencloud = "main:main"

[tool.setuptools]
py-modules = ["main"]
